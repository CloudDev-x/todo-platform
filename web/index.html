<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Platform</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; background: #f5f7fb; color: #222; }
    h1 { color: #0078d4; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 16px; background: #0078d4; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; background: #fff; padding: 10px; margin: 8px 0; border-radius: 6px; }
    li span { flex: 1; cursor: pointer; }
    li.done span { text-decoration: line-through; color: #888; }
    .del { background: #d13438; }
    .error { color: #d13438; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>To-Do</h1>
  <form id="add-form">
    <input id="text" placeholder="What needs doing?" autocomplete="off" required>
    <button type="submit">Add</button>
  </form>
  <p id="error" class="error"></p>
  <ul id="list"></ul>

  <script>
    const list = document.getElementById("list");
    const form = document.getElementById("add-form");
    const input = document.getElementById("text");
    const errorBox = document.getElementById("error");

    async function request(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) {
        const body = res.status === 204 ? {} : await res.json().catch(() => ({}));
        errorBox.textContent = body.error || `Request failed (${res.status})`;
        return null;
      }
      errorBox.textContent = "";
      return res.status === 204 ? true : res.json();
    }

    async function load() {
      const todos = await request("/api/todos");
      if (!todos) return;
      list.innerHTML = "";
      for (const t of todos) {
        const li = document.createElement("li");
        if (t.done) li.classList.add("done");

        const span = document.createElement("span");
        span.textContent = t.text;
        span.onclick = () => toggle(t.id);

        const del = document.createElement("button");
        del.textContent = "Delete";
        del.className = "del";
        del.onclick = () => remove(t.id);

        li.append(span, del);
        list.append(li);
      }
    }

    async function toggle(id) {
      await request(`/api/todos/${id}`, { method: "PATCH" });
      load();
    }

    async function remove(id) {
      await request(`/api/todos/${id}`, { method: "DELETE" });
      load();
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const created = await request("/api/todos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (created) input.value = "";
      load();
    };

    load();
  </script>
</body>
</html>
